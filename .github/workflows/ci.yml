name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - name: Ruff lint
        run: ruff check hooks scripts providers tests adapters
      - name: Ruff format check
        run: ruff format --check hooks scripts providers tests adapters

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - name: Mypy
        run: mypy hooks scripts providers tests adapters

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Canonical test suite (nonzero discovery required)
        shell: bash
        run: |
          set -o pipefail
          output="$(python3 -m unittest discover -s tests -v 2>&1)" || {
            status=$?
            printf '%s\n' "$output"
            exit "$status"
          }
          printf '%s\n' "$output"
          count="$(printf '%s\n' "$output" | awk '/^Ran [0-9]+ tests?/ {print $2}' | tail -1)"
          if [[ ! "$count" =~ ^[0-9]+$ ]] || (( count == 0 )); then
            echo "CI test guard: unittest discovery collected zero tests" >&2
            exit 1
          fi
          # Per-adapter collection guard: a shipped adapter's tests must actually
          # run, never quiet-skip. Add the adapter's test module here when it ships.
          for mod in test_codex_adapter test_hermes_adapter; do
            if ! printf '%s\n' "$output" | grep -q "$mod"; then
              echo "CI test guard: adapter tests '$mod' were not collected" >&2
              exit 1
            fi
          done
          echo "CI test guard: collected $count tests"
      - name: Byte-compile
        run: python3 -m compileall -q hooks scripts providers tests adapters

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node syntax check (OpenClaw adapter)
        run: |
          node --check adapters/openclaw/index.js
          node --check adapters/openclaw/lib.js
      - name: Node adapter unit tests
        run: node --test adapters/openclaw/*.test.js

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Privacy gate (tracked-file scan)
        run: python3 scripts/precommit-privacy-gate.py --scan-all
