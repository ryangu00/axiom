name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Hooks selftest
        run: python3 scripts/selftest.py
      - name: Providers selftest
        run: python3 scripts/selftest_providers.py
      - name: Byte-compile hooks, scripts, providers
        run: python3 -m compileall -q hooks scripts providers

  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for identity leaks
        run: python3 scripts/precommit-privacy-gate.py --scan-all
