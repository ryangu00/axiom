# Install: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: axiom-privacy-gate
        name: axiom privacy gate (staged additions)
        entry: python3 scripts/precommit-privacy-gate.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
